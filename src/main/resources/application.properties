spring.application.name=garage

# Load local .env file
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=2

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=garage

# Flyway: fail closed by default. Never mutate a shared database merely by starting the API.
# Only the approved migration operator should set FLYWAY_ENABLED=true after backup,
# schema-history verification and an agreed maintenance window.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# Required external JWT settings. Never commit PEM keys or supply insecure defaults.
auth.jwt.issuer=${JWT_ISSUER}
auth.jwt.audience=${JWT_AUDIENCE}
# File-backed keys remain supported; missing file placeholders fail startup unless BOTH
# protected runtime base64 PEM values are supplied to the JWT signer.
auth.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:classpath:/__richcomes_unconfigured_public_key__}
auth.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:classpath:/__richcomes_unconfigured_private_key__}

# Hosted container configuration: platform sets PORT and terminates HTTPS.
server.port=${PORT:8080}

# Expose only actuator health endpoints; never expose /env, /configprops or /metrics.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
