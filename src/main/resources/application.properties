spring.application.name=garage

# Load local .env file
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=2

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=garage

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Required external JWT settings. Never commit PEM keys or supply insecure defaults.
auth.jwt.issuer=${JWT_ISSUER}
auth.jwt.audience=${JWT_AUDIENCE}
auth.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
auth.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}
