# Explicit opt-in via validate-spring-context-isolated.sh only.
# No shared DB_URL fallback. Runner supplies all JDBC and JWT settings.
spring.application.name=garage-isolated-pg-test
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=garage
spring.flyway.enabled=false
spring.sql.init.mode=never
