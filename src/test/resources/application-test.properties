# Test profile configuration for integration tests
#
# When running locally without Docker/PostgreSQL, uses H2 in-memory database.
# When DB_URL environment variable is set (e.g., via validate-spring-context-isolated.sh),
# uses the specified PostgreSQL database with Flyway migrations.
#
# Spring Boot property precedence:
# - System properties (-D flags) > Environment Variables > This file > application.properties

spring.application.name=garage-test

#------------------------------------------------------------------------------
# Database Configuration
#------------------------------------------------------------------------------
# Use PostgreSQL when DB_URL is set, otherwise fall back to H2
# Note: environment variables have higher precedence than properties file values

# Datasource settings - will be overridden by env vars or system properties
# Default to H2 PostgreSQL-mode when no database URL is provided
spring.datasource.url=${DB_URL:jdbc:h2:mem:garage_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Driver class - auto-detect from URL if not explicitly set
# PostgreSQL is the default for production, H2 for tests without DB_URL
spring.datasource.driver-class-name=${DB_DRIVER:}

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=2

#------------------------------------------------------------------------------
# JPA/Hibernate Configuration
#------------------------------------------------------------------------------
# When using H2 (no DB_URL), Hibernate DDL creates schema
# When using PostgreSQL (DB_URL set), Flyway migrations create schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=garage
# Dialect will be auto-detected from JDBC connection, or use H2 as fallback
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

#------------------------------------------------------------------------------
# Flyway Configuration
#------------------------------------------------------------------------------
# Flyway is enabled when FLYWAY_ENABLED=true (passed as -D flag by CI)
# When enabled, migrations run against PostgreSQL (DB_URL must be set)
# When disabled, H2 DDL takes over
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=false

#------------------------------------------------------------------------------
# JWT Configuration (test keys)
#------------------------------------------------------------------------------
auth.jwt.issuer=test-issuer
auth.jwt.audience=test-audience
auth.jwt.public-key=classpath:/test-keys/public_key.pem
auth.jwt.private-key=classpath:/test-keys/private_key.pem

#------------------------------------------------------------------------------
# Actuator Configuration
#------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never