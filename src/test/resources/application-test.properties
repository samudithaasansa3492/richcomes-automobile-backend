# H2-only test profile. Never interpolate DB_URL, DB_USERNAME, DB_PASSWORD,
# DB_DIALECT or FLYWAY_ENABLED from a developer's shared database configuration.
spring.application.name=garage-test
spring.datasource.url=jdbc:h2:mem:garage_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;INIT=RUNSCRIPT FROM 'classpath:init-garage-schema.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=garage
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.flyway.enabled=false
spring.sql.init.mode=never
auth.jwt.issuer=test-issuer
auth.jwt.audience=test-audience
auth.jwt.public-key=classpath:/test-keys/public_key.pem
auth.jwt.private-key=classpath:/test-keys/private_key.pem
