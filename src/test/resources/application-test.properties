# Test profile configuration for integration tests
# Uses H2 in-memory database instead of PostgreSQL

spring.application.name=garage-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:garage_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hikari Connection Pool (small for tests)
spring.datasource.hikari.maximum-pool-size=2

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=garage
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Flyway: disabled for tests (H2 creates schema via ddl-auto)
spring.flyway.enabled=false

# JWT settings for tests (use test keys)
auth.jwt.issuer=test-issuer
auth.jwt.audience=test-audience
auth.jwt.public-key=classpath:/test-keys/public_key.pem
auth.jwt.private-key=classpath:/test-keys/private_key.pem

# Actuator health endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Disable Flyway baseline check for tests
spring.flyway.baseline-on-migrate=false