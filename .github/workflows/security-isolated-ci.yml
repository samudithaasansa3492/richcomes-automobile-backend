name: Richcomes isolated security and migration CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "scripts/**"
      - ".github/workflows/security-isolated-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: richcomes-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-security:
    name: Java 21 regression / PostgreSQL / Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Reject checkout with local .env
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          java -version
          docker info >/dev/null

      - name: Validate guarded backup script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backup-garage-with-restore-rehearsal.sh
          bash -n scripts/validate-flyway-isolated.sh

      - name: Selected regression tests (no external database)
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            ./mvnw -B -Dspring.flyway.enabled=false \
            -Dtest='*,!GarageApplicationTests,!ServiceCategoryControllerTest,!CashierPermissionPostgresIT' \
            clean test

      - name: Spring Boot full context and signed-JWT PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            bash scripts/validate-spring-context-isolated.sh

      - name: Flyway fresh and V1-V14 upgrade on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            bash scripts/validate-flyway-isolated.sh
