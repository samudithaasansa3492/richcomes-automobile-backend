name: Richcomes isolated security and migration CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "scripts/**"
      - ".github/workflows/security-isolated-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: richcomes-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-safety:
    name: Database safety / poisoned environment regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prove unit tests cannot inherit shared database settings
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          trap 'rm -f .env' EXIT
          # Fake loopback target only; no real secrets or database server.
          printf '%s\n' 'DB_URL=jdbc:postgresql://127.0.0.1:1/forbidden' 'DB_USERNAME=poisoned' 'DB_PASSWORD=not-a-secret' 'DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect' 'FLYWAY_ENABLED=true' 'richcomes.test.dotenv-marker=must-not-load' > .env
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            DB_URL=jdbc:postgresql://127.0.0.1:1/forbidden DB_USERNAME=poisoned DB_PASSWORD=not-a-secret \
            DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect FLYWAY_ENABLED=true \
            ./mvnw -B -Dtest='*,!GarageApplicationTests,!ServiceCategoryControllerTest,!CashierPermissionPostgresIT' clean test

  isolated-security:
    name: Java 21 regression / PostgreSQL / Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Reject checkout with local .env
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          java -version
          docker info >/dev/null

      - name: Validate guarded backup script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backup-garage-with-restore-rehearsal.sh
          bash -n scripts/railway-offsite-backup.sh
          bash -n scripts/test-offsite-backup-guards.sh
          bash scripts/test-offsite-backup-guards.sh
          bash -n scripts/check-shared-flyway-history-readonly.sh
          python3 scripts/test-flyway-history-preflight.py
          bash -n scripts/validate-flyway-isolated.sh
          bash -n scripts/backup-garage-v26-with-restore-rehearsal.sh
          bash -n scripts/railway-offsite-v26-backup.sh
          bash -n scripts/check-shared-flyway-v26-readonly.sh
          bash -n scripts/test-offsite-v26-backup-guards.sh
          bash scripts/test-offsite-v26-backup-guards.sh
          python3 scripts/test-flyway-v26-history-preflight.py
          # V28-specific backup guards: offline only, no production credentials.
          bash -n scripts/backup-garage-v28-with-restore-rehearsal.sh
          bash -n scripts/railway-offsite-v28-backup.sh
          bash -n scripts/check-shared-flyway-v28-readonly.sh
          bash -n scripts/test-offsite-v28-backup-guards.sh
          bash scripts/test-offsite-v28-backup-guards.sh
          python3 scripts/test-flyway-v28-history-preflight.py
          # Source-driven Flyway version policy; V1-V28 checksums are immutable.
          python3 scripts/check-flyway-source-versions.py
          python3 scripts/test-flyway-source-policy.py
          python3 scripts/test-pr-flyway-collisions.py
          python3 -m py_compile scripts/check-pr-flyway-collisions.py scripts/check-flyway-source-versions.py
          bash -n scripts/prepare-isolated-context-schema.sh
          bash -n scripts/validate-spring-context-isolated.sh
          bash -n scripts/team-dev.sh
          bash -n scripts/seed-team-dev-accounts.sh

      # Read-only API check: catches two still-open PRs claiming V30 etc.
      # Not a substitute for coordination of unpushed/unopened branches.
      - name: Reject migration versions already claimed by another open PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/check-pr-flyway-collisions.py

      - name: Validate recovery client security flows (no network or secrets)
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main/resources/static/account-setup.js
          node scripts/test-account-setup-client.mjs

      - name: Selected regression tests (no external database)
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            ./mvnw -B -Dspring.flyway.enabled=false \
            -Dtest='*,!GarageApplicationTests,!ServiceCategoryControllerTest,!CashierPermissionPostgresIT' \
            clean test

      - name: Spring Boot full context and signed-JWT PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            bash scripts/validate-spring-context-isolated.sh

      - name: Flyway fresh and V1-V14 upgrade on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" USER="runner" PATH="$PATH" JAVA_HOME="$JAVA_HOME" \
            bash scripts/validate-flyway-isolated.sh

      - name: Build deployable non-root Java 21 container (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag richcomes-backend:ci .

      - name: Smoke test disposable team backend on Compose (isolated)
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash -n scripts/team-dev.sh
          docker compose --version
          trap 'bash scripts/team-dev.sh down || true' EXIT
          bash scripts/team-dev.sh up
          ready=0
          for i in $(seq 1 90); do
            if bash scripts/team-dev.sh verify; then ready=1; break; fi
            container_id="$(docker ps -aq --filter "name=^/richcomes-team-$(id -u)-backend-1$" | head -n 1)"
            if [ -n "$container_id" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container_id" 2>/dev/null)" = "exited" ]; then
              echo "Backend exited during smoke test"
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: disposable team backend did not become ready"
            bash scripts/team-dev.sh logs || true
            exit 1
          fi
          # Only local synthetic OWNER/CASHIER records; never external data.
          bash -n scripts/seed-team-dev-accounts.sh
          bash scripts/seed-team-dev-accounts.sh create
          bash scripts/seed-team-dev-accounts.sh verify
          test "$(curl -s -o /dev/null -w '%{http_code}'             http://127.0.0.1:18080/actuator/env)" = "401"
          echo "PASS: team backend fully started and authenticated routes remain protected"
